              - generic [ref=e148]:
                - heading "JOIN NASA SPACE APPS CHALLENGE NOVEMBER 14-15, 2026" [level=2] [ref=e149]
                - paragraph [ref=e150]: The NASA Space Apps Challenge offers opportunities for anyone with an interest in space and science to address real-world challenges through our annual hackathon and global community. All ages, skill levels, and professional backgrounds are welcome. At NASA Space Apps, there's always space for one more!
              - generic [ref=e155]:
                - generic [ref=e157]:
                  - img "Two women wearing NASA Space Apps Albuquerque shirts smile facing the camera in a lobby area." [ref=e159]
                  - img "Three men are sitting at a long table with laptops while two men standing behind them looking at the screens and smiling during a NASA Space Apps Challenge Local Event." [ref=e161]
                - generic [ref=e163]:
                  - heading "Real-World Challenges" [level=3] [ref=e164]
                  - paragraph [ref=e165]: The annual NASA Space Apps Challenge provides the opportunity to engage directly with NASA’s data, along with Space Agency Partner data. During the two-day hackathon, teams use this data to address challenges written by NASA Subject Matter Experts, featuring topics including storytelling, software development, astrophysics, space exploration, agriculture, and more.
              - blockquote [ref=e170]:
                - generic [ref=e171]: “I believe it is paramount to give the next generation of scientists, engineers, designers, and more from across the world a chance to contribute to NASA’s overall mission. The NASA Space Apps Challenge provides this opportunity by giving people – from all backgrounds and walks of life – a way to engage directly with NASA scientists and open data,” said Dr. Nicky Fox, Associate Administrator for NASA’s Science Mission Directorate.
              - generic [ref=e176]:
                - generic [ref=e178]:
                  - img "Six people are gathered around a laptop on a desk looking at the screen during a NASA Space Apps Challenge Local Event." [ref=e180]
                  - img "Six people are sitting in chairs around a rectangular table holding a conversation at a NASA Space Apps Challenge event." [ref=e182]
                - generic [ref=e184]:
                  - heading "Meet like-minded individuals" [level=3] [ref=e185]
                  - paragraph [ref=e186]: When you participate in NASA Space Apps, you join a community that shares a desire to propel humanity forward through scientific and technological innovation.
              - blockquote [ref=e191]:
                - generic [ref=e192]: “The NASA Space Apps Challenge changed my perspective on NASA’s data. I realized there are so many different datasets, and we can use them to make solutions that matter here on Earth or even in space.” - Space Apps Participant
